[project]
name = "llm-rlhf"
version = "0.1.0"
description = "How is reasoning built in a language model? Pretraining, imitation and reinforcement learning (GRPO) on GSM8K, from scratch"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "numpy>=1.26",
    "transformers>=4.56",
    "datasets>=2.20",
    "peft>=0.12",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
cpu = [
    "torch>=2.2",
]
gpu = [
    "torch>=2.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", group = "gpu" },
  { index = "pytorch-cpu", group = "cpu" },
]

[tool.uv]
package = false  # notebooks only, nothing to install
conflicts = [
  [{ group = "cpu" }, { group = "gpu" }],
]
